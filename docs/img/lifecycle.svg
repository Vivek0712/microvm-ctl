<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="16" fill="#f8fafc"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#0f172a">microVM lifecycle, and what each state costs</text>
  <text x="30" y="66" font-size="12" fill="#475569">Before any of this, the image build runs your Dockerfile on a build VM, waits for /ready to answer 200, snapshots memory and disk, then runs /validate on a fresh clone.</text>
  <text x="30" y="84" font-size="12" fill="#475569">Every RunMicrovm restores that same snapshot, so a 600 MB Python process is serving in seconds with its imports already done.</text>

  <!-- states -->
  <rect x="30" y="160" width="150" height="80" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="105" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#713f12">PENDING</text>
  <text x="105" y="218" text-anchor="middle" font-size="12" fill="#854d0e">snapshot restoring</text>

  <rect x="270" y="160" width="190" height="80" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="365" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#064e3b">RUNNING</text>
  <text x="365" y="218" text-anchor="middle" font-size="12" fill="#065f46">vCPU + memory per second</text>

  <rect x="720" y="160" width="190" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="815" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">SUSPENDED</text>
  <text x="815" y="218" text-anchor="middle" font-size="12" fill="#1e40af">snapshot storage only</text>

  <rect x="990" y="160" width="180" height="80" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1080" y="195" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">TERMINATED</text>
  <text x="1080" y="218" text-anchor="middle" font-size="12" fill="#334155">zero, quota freed after a lag</text>

  <!-- PENDING -> RUNNING -->
  <line x1="180" y1="200" x2="270" y2="200" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="225" y="188" text-anchor="middle" font-size="11" fill="#374151">/run gives 200</text>

  <!-- RUNNING -> SUSPENDED (top) -->
  <line x1="460" y1="185" x2="720" y2="185" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="590" y="158" text-anchor="middle" font-size="11" fill="#374151">idle policy fires or SuspendMicrovm</text>
  <text x="590" y="174" text-anchor="middle" font-size="11" fill="#6b7280">/suspend hook first, 2.5 s measured</text>

  <!-- SUSPENDED -> RUNNING (bottom) -->
  <line x1="720" y1="215" x2="460" y2="215" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="590" y="236" text-anchor="middle" font-size="11" fill="#374151">ResumeMicrovm, or any request (auto-resume)</text>
  <text x="590" y="252" text-anchor="middle" font-size="11" fill="#6b7280">/resume hook gives 200, same PID, 2.6 s measured</text>

  <!-- SUSPENDED -> TERMINATED -->
  <line x1="910" y1="200" x2="990" y2="200" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="950" y="150" text-anchor="middle" font-size="11" fill="#374151">suspendedDurationSeconds</text>
  <text x="950" y="165" text-anchor="middle" font-size="11" fill="#6b7280">elapses</text>
  <line x1="950" y1="170" x2="950" y2="196" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- RUNNING -> TERMINATED (bottom loop) -->
  <path d="M365,240 L365,320 L1080,320 L1080,240" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <text x="722" y="338" text-anchor="middle" font-size="11" fill="#374151">TerminateMicrovm, maximumDurationInSeconds, or the 8 hour ceiling (/terminate hook runs first)</text>

  <!-- measured numbers -->
  <rect x="30" y="365" width="1140" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="387" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="600">Measured on the live service (us-east-1, 2 GB image, 609 MB memory snapshot)</text>
  <text x="600" y="405" text-anchor="middle" font-size="12" fill="#334155">RunMicrovm to serving p50 3.54 s  |  suspend 2.5 s  |  resume 2.6 s with the same PID  |  first request to a suspended VM: 200 in 0.7 s  |  0 to 6 VMs in 9.7 s</text>
</svg>
