<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="16" fill="#f8fafc"/>

  <!-- column: your side -->
  <rect x="30" y="60" width="260" height="520" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="160" y="92" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Your side</text>
  <text x="160" y="112" text-anchor="middle" font-size="12" fill="#64748b">laptop, CI job, orchestrator Lambda</text>

  <rect x="55" y="140" width="210" height="70" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="160" y="170" text-anchor="middle" font-size="16" font-weight="600" fill="#312e81">mvm CLI</text>
  <text x="160" y="192" text-anchor="middle" font-size="12" fill="#4338ca">bootstrap, image, run, scale, call, top</text>

  <rect x="55" y="240" width="210" height="150" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="160" y="268" text-anchor="middle" font-size="16" font-weight="600" fill="#312e81">Python SDK</text>
  <text x="160" y="294" text-anchor="middle" font-size="13" fill="#4338ca">ImageBuilder</text>
  <text x="160" y="314" text-anchor="middle" font-size="13" fill="#4338ca">FleetManager / Fleet</text>
  <text x="160" y="334" text-anchor="middle" font-size="13" fill="#4338ca">EndpointClient</text>
  <text x="160" y="354" text-anchor="middle" font-size="13" fill="#4338ca">FleetMonitor / CostModel</text>
  <text x="160" y="378" text-anchor="middle" font-size="11" fill="#6b7280">token bucket at 80% of applied quota</text>

  <rect x="55" y="420" width="210" height="130" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="160" y="448" text-anchor="middle" font-size="15" font-weight="600" fill="#7c2d12">Benchmark harness</text>
  <text x="160" y="472" text-anchor="middle" font-size="12" fill="#9a3412">launch, warm, suspend/resume,</text>
  <text x="160" y="490" text-anchor="middle" font-size="12" fill="#9a3412">auto-resume, scale, cost</text>
  <text x="160" y="520" text-anchor="middle" font-size="11" fill="#6b7280">JSON + SVG transcript per run</text>

  <!-- column: control plane -->
  <rect x="330" y="60" width="380" height="520" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="520" y="92" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Control plane</text>
  <text x="520" y="112" text-anchor="middle" font-size="12" fill="#64748b">lambda-microvms API over SigV4</text>

  <rect x="355" y="140" width="330" height="80" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="520" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#064e3b">Image factory</text>
  <text x="520" y="188" text-anchor="middle" font-size="12" fill="#065f46">app dir + Dockerfile  -&gt;  zip  -&gt;  S3  -&gt;  build VM</text>
  <text x="520" y="206" text-anchor="middle" font-size="12" fill="#065f46">/ready returns 200  -&gt;  memory + disk snapshot</text>

  <rect x="355" y="240" width="330" height="80" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="520" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#064e3b">Lifecycle</text>
  <text x="520" y="288" text-anchor="middle" font-size="12" fill="#065f46">RunMicrovm, SuspendMicrovm, ResumeMicrovm,</text>
  <text x="520" y="306" text-anchor="middle" font-size="12" fill="#065f46">TerminateMicrovm, idle policy, duration caps</text>

  <rect x="355" y="340" width="330" height="70" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="520" y="366" text-anchor="middle" font-size="15" font-weight="600" fill="#064e3b">CreateMicrovmAuthToken</text>
  <text x="520" y="390" text-anchor="middle" font-size="12" fill="#065f46">port-scoped JWE, 1 to 60 minutes, cached to 80% TTL</text>

  <rect x="355" y="430" width="330" height="60" rx="10" fill="#fefce8" stroke="#eab308"/>
  <text x="520" y="455" text-anchor="middle" font-size="15" font-weight="600" fill="#713f12">Service Quotas</text>
  <text x="520" y="477" text-anchor="middle" font-size="12" fill="#854d0e">applied TPS and memory ceiling, read at startup</text>

  <rect x="355" y="510" width="330" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="520" y="532" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">CloudWatch Logs</text>
  <text x="520" y="550" text-anchor="middle" font-size="11" fill="#475569">/aws/lambda/microvms/&lt;image&gt;, one stream per VM</text>

  <!-- column: execution plane -->
  <rect x="750" y="60" width="420" height="520" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="960" y="92" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Execution plane</text>
  <text x="960" y="112" text-anchor="middle" font-size="12" fill="#64748b">one HTTPS endpoint per Firecracker microVM</text>

  <g id="vm1">
    <rect x="775" y="140" width="370" height="120" rx="10" fill="#fdf2f8" stroke="#db2777"/>
    <text x="790" y="165" font-size="13" font-weight="600" fill="#831843">microVM  a1b2.lambda-microvm.us-east-1.on.aws</text>
    <rect x="790" y="178" width="340" height="66" rx="8" fill="#ffffff" stroke="#f9a8d4"/>
    <text x="960" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#9d174d">your app + HookApp on :8080</text>
    <text x="960" y="220" text-anchor="middle" font-size="11" fill="#9d174d">/ready /validate /run /resume /suspend /terminate</text>
    <text x="960" y="236" text-anchor="middle" font-size="11" fill="#9d174d">POST /execute, GET /state, ... your routes</text>
  </g>
  <g transform="translate(0,140)">
    <rect x="775" y="140" width="370" height="120" rx="10" fill="#fdf2f8" stroke="#db2777"/>
    <text x="790" y="165" font-size="13" font-weight="600" fill="#831843">microVM  c3d4.lambda-microvm.us-east-1.on.aws</text>
    <rect x="790" y="178" width="340" height="66" rx="8" fill="#ffffff" stroke="#f9a8d4"/>
    <text x="960" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#9d174d">same snapshot, own kernel, own PID 1</text>
    <text x="960" y="220" text-anchor="middle" font-size="11" fill="#9d174d">identity arrives in /run via runHookPayload</text>
    <text x="960" y="236" text-anchor="middle" font-size="11" fill="#9d174d">credentials from the execution role, never the image</text>
  </g>
  <g transform="translate(0,280)">
    <rect x="775" y="140" width="370" height="120" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-dasharray="6 4"/>
    <text x="790" y="165" font-size="13" font-weight="600" fill="#831843">microVM  e5f6 ... (SUSPENDED)</text>
    <rect x="790" y="178" width="340" height="66" rx="8" fill="#ffffff" stroke="#f9a8d4" stroke-dasharray="6 4"/>
    <text x="960" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#9d174d">memory frozen to snapshot storage</text>
    <text x="960" y="220" text-anchor="middle" font-size="11" fill="#9d174d">compute billing stopped, quota still held</text>
    <text x="960" y="236" text-anchor="middle" font-size="11" fill="#9d174d">next request auto-resumes it (200 in 0.7 s measured)</text>
  </g>

  <!-- arrows: your side -> control plane -->
  <line x1="265" y1="175" x2="355" y2="175" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="300" x2="355" y2="300" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="292" text-anchor="middle" font-size="10" fill="#374151">SigV4</text>

  <!-- arrows: your side -> execution plane (HTTPS with token), drawn along the bottom -->
  <path d="M160,550 L160,600 L960,600 L960,562" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="618" text-anchor="middle" font-size="12" fill="#374151">HTTPS + X-aws-proxy-auth (JWE), X-aws-proxy-port, 429 backoff, patient 502 retry during auto-resume</text>

  <!-- arrows: control plane -> execution plane hooks -->
  <line x1="685" y1="280" x2="775" y2="200" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>
  <line x1="685" y1="290" x2="775" y2="340" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>
  <text x="730" y="330" text-anchor="middle" font-size="10" fill="#9a3412">POST hooks</text>

  <!-- title -->
  <text x="30" y="36" font-size="20" font-weight="700" fill="#0f172a">microvm-ctl: two planes around one primitive</text>
</svg>
