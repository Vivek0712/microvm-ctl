[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microvm-ctl"
version = "0.2.1"
description = "Control and execution plane for AWS Lambda MicroVMs: build images, launch Firecracker microVMs, scale fleets inside your quotas, call into them securely, and watch it all live."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Vivek Raja P S" }]
keywords = ["aws", "lambda", "microvm", "firecracker", "sandbox", "serverless", "fleet", "orchestrator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "boto3>=1.34",
    "requests>=2.31",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/Vivek0712/microvm-ctl"
Repository = "https://github.com/Vivek0712/microvm-ctl"
Documentation = "https://github.com/Vivek0712/microvm-ctl/tree/main/docs"
Changelog = "https://github.com/Vivek0712/microvm-ctl/blob/main/CHANGELOG.md"
Examples = "https://github.com/Vivek0712/awesome-microvm"
Articles = "https://builder.aws.com/content/3JIDTpz0ZgatSBv24drra3gEod9/control-and-scale-aws-lambda-microvms-with-microvm-ctl"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
durable = ["aws-durable-execution-sdk-python>=2.0.0"]

[project.scripts]
mvm = "microvm.cli:main"

[tool.setuptools.packages.find]
include = ["microvm*"]

[tool.setuptools.package-data]
microvm = ["data/**/*", "playground/static/*"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E731"]
