[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microvm-ctl"
version = "0.1.0"
description = "Control & execution plane for AWS Lambda MicroVMs — build images, spin up Firecracker microVMs, scale fleets, call into them securely, and monitor everything."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Vivek Raja P S" }]
keywords = ["aws", "lambda", "microvm", "firecracker", "sandbox", "serverless", "fleet", "orchestrator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "boto3>=1.34",
    "requests>=2.31",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/vivekrajaps/microvm-ctl"
Documentation = "https://github.com/vivekrajaps/microvm-ctl/tree/main/docs"
Examples = "https://github.com/vivekrajaps/awesome-microvm"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mvm = "microvm.cli:main"

[tool.setuptools.packages.find]
include = ["microvm*"]

[tool.setuptools.package-data]
microvm = ["data/**/*"]
